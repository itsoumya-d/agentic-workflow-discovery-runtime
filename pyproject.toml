[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-discovery-runtime"
version = "0.1.0"
description = "Deterministic enterprise agent runtime for workflow decomposition and human-in-the-loop review escalation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
